<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LearnCraft — 강의 상세</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <style>
    .concept-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: var(--space-4);
      margin-top: var(--space-4);
    }
    .concept-card {
      padding: var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
    }
    .concept-term {
      font-size: var(--text-sm); font-weight: 700;
      color: var(--color-primary);
      margin-bottom: var(--space-2);
    }
    .concept-desc { font-size: var(--text-sm); color: var(--color-text-secondary); line-height: 1.6; }

    .review-list { list-style: none; padding: 0; margin: var(--space-4) 0 0; }
    .review-list li {
      display: flex; align-items: flex-start; gap: var(--space-3);
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--color-border-light);
      font-size: var(--text-sm); line-height: 1.6; color: var(--color-text-secondary);
    }
    .review-list li:last-child { border-bottom: none; }
    .review-list li::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: var(--color-primary); flex-shrink: 0; margin-top: 7px;
    }

    .summary-block {
      font-size: var(--text-sm); line-height: 1.8;
      color: var(--color-text-secondary);
      white-space: pre-wrap;
    }

    .loading-spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--color-border); border-top-color: var(--color-primary);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<nav class="top-nav">
  <div class="top-nav-inner">
    <a href="index.html" class="nav-logo-wrap">
      <img src="../docs/img/RGB_LIKELION_KR.png" alt="Likelion" class="nav-logo" />
      <span class="nav-logo-label">LearnCraft</span>
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="lectures.html" class="nav-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>강의 목록</span>
      </a>
      <a href="quiz-setup.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>퀴즈 생성</span>
      </a>
      <a href="personalized-guide.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        <span>개인화 가이드</span>
      </a>
      <a href="quality-report.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>품질 보고서</span>
      </a>
    </div>
    <div class="nav-actions">
      <a href="login.html" class="nav-btn-auth">로그인/회원가입</a>
    </div>
  </div>
</nav>

<main>
  <div class="container">
    <div class="page-content">

      <nav class="breadcrumb">
        <a href="index.html">Dashboard</a>
        <span class="breadcrumb-sep">›</span>
        <a href="lectures.html">강의 목록</a>
        <span class="breadcrumb-sep">›</span>
        <span class="breadcrumb-current" id="breadcrumbDate">불러오는 중...</span>
      </nav>

      <!-- Loading -->
      <div id="loadingState">
        <div style="display:grid; grid-template-columns:1fr 320px; gap:32px;">
          <div>
            <div class="skeleton skeleton-line" style="width:60%; height:32px; margin-bottom:16px;"></div>
            <div class="skeleton skeleton-line" style="width:100%; height:14px;"></div>
            <div class="skeleton skeleton-line" style="width:90%; height:14px;"></div>
            <div class="skeleton skeleton-card" style="margin-top:24px;"></div>
          </div>
          <div class="skeleton skeleton-card"></div>
        </div>
      </div>

      <!-- Error -->
      <div class="card hidden" id="errorState">
        <div class="empty-state">
          <div class="empty-state-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </div>
          <h3>강의를 불러올 수 없습니다</h3>
          <p id="errorMsg"></p>
          <a href="lectures.html" class="btn btn-secondary">목록으로</a>
        </div>
      </div>

      <!-- Main content (hidden until loaded) -->
      <div class="hidden" id="mainContent">
        <div class="grid-2-col">

          <!-- Left -->
          <div>
            <div class="section">
              <div class="flex items-center gap-3 mb-3">
                <span class="text-xs text-muted" id="detailDate"></span>
              </div>
              <h1 id="detailTitle" style="font-size:var(--text-2xl);font-weight:700;letter-spacing:-0.02em;line-height:1.3;margin-bottom:var(--space-4);"></h1>
              <div class="flex flex-wrap gap-2" id="detailBadges"></div>
            </div>

            <div class="divider"></div>

            <div class="section">
              <div class="section-header">
                <div class="section-header-text"><h2>강의 정보</h2></div>
              </div>
              <div class="card" style="padding:var(--space-5);">
                <div style="display:grid;grid-template-columns:120px 1fr;gap:var(--space-3) var(--space-5);" id="detailMeta"></div>
              </div>
            </div>

            <div class="section">
              <div class="section-header">
                <div class="section-header-text">
                  <h2>학습 목표</h2>
                </div>
              </div>
              <div class="card">
                <p class="text-sm text-secondary" id="detailGoal" style="line-height:1.8;"></p>
              </div>
            </div>
          </div>

          <!-- Sidebar -->
          <div class="sidebar-sticky">
            <div class="card" style="border-color:var(--color-primary);border-width:1.5px;margin-bottom:var(--space-4);">
              <div style="margin-bottom:var(--space-4);">
                <div class="text-base font-semibold text-primary mb-1">이 강의로 퀴즈 생성</div>
                <div class="text-sm text-secondary">강의 내용 기반으로 AI가 문제를 자동 생성합니다.</div>
              </div>
              <div class="form-group" style="margin-bottom:var(--space-4);">
                <label class="form-label">난이도 선택</label>
                <select class="select" id="sidebarDifficulty">
                  <option value="easy">쉬움 — 10문항 (객관식 위주)</option>
                  <option value="medium" selected>중간 — 10문항 (혼합형)</option>
                  <option value="hard">어려움 — 10문항 (응용 위주)</option>
                </select>
              </div>
              <button class="btn btn-primary btn-full" onclick="goToQuizSetup()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                퀴즈 생성하기
              </button>
            </div>

            <div class="card" style="margin-bottom:var(--space-4);">
              <div style="margin-bottom:var(--space-4);">
                <div class="text-base font-semibold mb-1">이 강의 학습 가이드</div>
                <div class="text-sm text-secondary">강의 핵심 개념과 복습 포인트를 AI가 요약합니다.</div>
              </div>
              <button class="btn btn-secondary btn-full" id="guideBtn" onclick="generateGuide()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                학습 가이드 생성하기
              </button>
            </div>
          </div>

        </div>

        <!-- Guide loading -->
        <div class="card hidden" id="guideLoading" style="padding:var(--space-8);text-align:center;margin-top:var(--space-6);">
          <div class="loading-spinner" style="margin-bottom:var(--space-4);"></div>
          <div class="text-sm text-secondary">학습 가이드를 생성하고 있습니다...</div>
        </div>

        <!-- Guide error -->
        <div class="hidden" id="guideError" style="margin-top:var(--space-6);">
          <div class="card" style="padding:var(--space-4);border-color:#FECACA;background:var(--color-error-light);">
            <div class="text-sm" style="color:#B91C1C;" id="guideErrorMsg"></div>
          </div>
        </div>

        <!-- Guide result -->
        <div class="hidden" id="guideResult" style="margin-top:var(--space-6);">
          <div class="divider"></div>

          <div class="section">
            <div class="section-header">
              <div class="section-header-text">
                <h2>핵심 개념</h2>
                <p>이 강의의 핵심 개념들입니다.</p>
              </div>
            </div>
            <div class="concept-grid" id="guideConceptGrid"></div>
          </div>

          <div class="section">
            <div class="section-header">
              <div class="section-header-text"><h2>학습 요약</h2></div>
            </div>
            <div class="card" style="padding:var(--space-5);">
              <div class="summary-block" id="guideSummary"></div>
            </div>
          </div>

          <div class="section">
            <div class="section-header">
              <div class="section-header-text"><h2>복습 포인트</h2></div>
            </div>
            <div class="card" style="padding:var(--space-4) var(--space-5);">
              <ul class="review-list" id="guideReviewList"></ul>
            </div>
          </div>


        </div>

      </div>

    </div>
  </div>
</main>

<script>
  const API = 'http://localhost:8000';
  const params = new URLSearchParams(location.search);
  const date = params.get('date');

  async function load() {
    if (!date) {
      showError('날짜 파라미터가 없습니다. 강의 목록에서 다시 접근해주세요.');
      return;
    }

    try {
      const res = await fetch(`${API}/api/lectures/${date}`);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }
      const lec = await res.json();
      render(lec);
    } catch (e) {
      showError(e.message);
    }
  }

  function render(lec) {
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('mainContent').classList.remove('hidden');
    document.title = `LearnCraft — ${lec.date}`;

    document.getElementById('breadcrumbDate').textContent = lec.date;
    document.getElementById('detailDate').textContent = lec.date;
    document.getElementById('detailTitle').textContent = lec.subject || `강의 ${lec.date}`;
    document.getElementById('detailGoal').textContent = lec.learning_goal || '학습 목표 정보가 없습니다.';

    // Badges
    const badges = document.getElementById('detailBadges');
    if (lec.subject) badges.innerHTML += `<span class="badge badge-primary">${lec.subject}</span>`;
    if (lec.content) badges.innerHTML += `<span class="badge badge-muted">${lec.content}</span>`;

    // Meta grid
    const meta = document.getElementById('detailMeta');
    const rows = [
      ['과목', lec.subject],
      ['학습 내용', lec.content],
      ['강의 일자', lec.date],
    ];
    meta.innerHTML = rows.filter(([, v]) => v).map(([k, v]) => `
      <div class="text-xs text-muted font-medium" style="padding-top:2px;">${k}</div>
      <div class="text-sm text-secondary">${v}</div>
    `).join('');
  }

  function showError(msg) {
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('errorState').classList.remove('hidden');
    document.getElementById('errorMsg').textContent = msg;
  }

  function goToQuizSetup() {
    const diff = document.getElementById('sidebarDifficulty').value;
    location.href = `quiz-setup.html?date=${date}&difficulty=${diff}`;
  }

  async function generateGuide() {
    const btn = document.getElementById('guideBtn');
    btn.disabled = true;
    btn.textContent = '생성 중...';

    document.getElementById('guideError').classList.add('hidden');
    document.getElementById('guideResult').classList.add('hidden');
    document.getElementById('guideLoading').classList.remove('hidden');
    document.getElementById('guideLoading').scrollIntoView({ behavior: 'smooth', block: 'start' });

    try {
      const res = await fetch(`${API}/api/guide/${date}`);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }
      const data = await res.json();
      renderGuide(data);
    } catch (e) {
      document.getElementById('guideLoading').classList.add('hidden');
      document.getElementById('guideErrorMsg').textContent = '가이드 생성 실패: ' + e.message;
      document.getElementById('guideError').classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> 학습 가이드 생성하기';
    }
  }

  function renderGuide(data) {
    document.getElementById('guideLoading').classList.add('hidden');

    // 핵심 개념
    const grid = document.getElementById('guideConceptGrid');
    const concepts = data.key_concepts || [];
    grid.innerHTML = concepts.map(c => `
      <div class="concept-card">
        <div class="concept-term">${escHtml(c.term || '')}</div>
        <div class="concept-desc">${escHtml(c.description || '')}</div>
      </div>
    `).join('') || '<p class="text-sm text-secondary">개념 데이터가 없습니다.</p>';

    // 요약
    document.getElementById('guideSummary').textContent = data.summary || '';

    // 복습 포인트
    const points = data.review_points || [];
    document.getElementById('guideReviewList').innerHTML = points.map(p =>
      `<li>${escHtml(p)}</li>`
    ).join('') || '<li>복습 포인트가 없습니다.</li>';

    document.getElementById('guideResult').classList.remove('hidden');
    document.getElementById('guideResult').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  load();
</script>

</body>
</html>
