<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LearnCraft — 오답노트</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <style>
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-bottom: var(--space-6);
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-secondary);
      font-size: var(--text-xs);
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .filter-btn.active {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }

    .filter-btn:hover:not(.active) {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .note-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-5) var(--space-6);
      margin-bottom: var(--space-4);
      transition: box-shadow 0.15s;
    }

    .note-card:hover {
      box-shadow: var(--shadow-sm);
    }

    .note-meta {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
      flex-wrap: wrap;
    }

    .note-question {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: var(--space-3);
      line-height: 1.5;
    }

    .note-answers {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-4);
      margin-bottom: var(--space-3);
    }

    .note-answer-wrong {
      font-size: var(--text-xs);
      color: #B91C1C;
      font-weight: 600;
    }

    .note-answer-correct {
      font-size: var(--text-xs);
      color: #15803D;
      font-weight: 600;
    }

    .note-explanation {
      font-size: var(--text-xs);
      color: var(--color-text-secondary);
      background: var(--color-bg);
      border-radius: var(--radius-sm);
      padding: var(--space-3) var(--space-4);
      margin-bottom: var(--space-4);
      line-height: 1.6;
    }

    .note-actions {
      display: flex;
      gap: var(--space-2);
    }

    .empty-state {
      text-align: center;
      padding: var(--space-16) var(--space-8);
      color: var(--color-text-secondary);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      color: var(--color-border-strong);
      margin-bottom: var(--space-4);
    }

    .empty-state-title {
      font-size: var(--text-lg);
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: var(--space-2);
    }

    .login-prompt {
      text-align: center;
      padding: var(--space-16) var(--space-8);
    }

    .login-prompt svg {
      width: 48px;
      height: 48px;
      color: var(--color-border-strong);
      margin-bottom: var(--space-4);
    }

    #noteList { min-height: 120px; }
  </style>
</head>
<body>

<!-- ─── Top Navigation ─── -->

  <div class="top-nav-inner">

      <img src="../docs/img/RGB_LIKELION_KR.png" alt="Likelion" class="nav-logo" />

    </a>
    <div class="nav-links">

        <span>Dashboard</span>
      </a>
      <a href="lectures.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>강의 목록</span>
      </a>
      <a href="quiz-setup.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>퀴즈 생성</span>
      </a>
      <a href="personalized-guide.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        <span>개인화 가이드</span>
      </a>
      <a href="wrong-notes.html" class="nav-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/></svg>
        <span>오답노트</span>
      </a>
      <a href="study-plan.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>학습 플랜</span>
      </a>
      <a href="quality-report.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>품질 보고서</span>
      </a>
    </div>
    <div class="nav-actions" id="navActions">
      <a href="login.html" class="nav-btn-auth">로그인/회원가입</a>
    </div>

<!-- ─── Page Content ─── -->
<main>
  <div class="container">
    <div class="page-content">

      <div class="page-header">
        <div class="page-header-text">
          <h1>오답노트</h1>
          <p>틀린 문제를 복습하고 취약한 개념을 보완하세요.</p>
        </div>
      </div>

      <!-- 비로그인 상태 -->
      <div id="loginPrompt" style="display:none;" class="login-prompt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <div class="empty-state-title" style="margin-top:var(--space-4);">로그인이 필요해요</div>
        <p class="text-sm text-secondary" style="margin:var(--space-2) 0 var(--space-6);">오답노트는 로그인한 유저만 사용할 수 있어요.</p>
        <a href="login.html" class="btn btn-primary">로그인하기</a>
      </div>

      <!-- 로그인 상태 -->
      <div id="notesSection" style="display:none;">
        <!-- 개념 태그 필터 -->
        <div class="filter-bar" id="filterBar">
          <button class="filter-btn active" onclick="filterByTag(this, '')">전체</button>
        </div>

        <!-- 오답 카드 목록 -->
        <div id="noteList"></div>
      </div>

    </div>
  </div>
</main>

<script>
  let allNotes = [];
  let currentTag = '';

  // ── 네비 인증 상태 ─────────────────────────────────────────────
  async function checkAuth() {
    const token = localStorage.getItem('lc_token');
    const navActions = document.getElementById('navActions');
    if (!token) return;
    try {
      const res = await fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${token}` } });
      if (!res.ok) { localStorage.removeItem('lc_token'); return; }
      const user = await res.json();
      navActions.innerHTML = `
        <span style="font-size:0.9rem;color:#555;margin-right:8px;">${user.name}님</span>
        <button class="nav-btn-auth" onclick="logout()" style="cursor:pointer;background:none;border:1px solid #ddd;border-radius:6px;padding:6px 14px;font-size:0.85rem;">로그아웃</button>
      `;
    } catch (e) {}
  }

  function logout() {
    localStorage.removeItem('lc_token');
    localStorage.removeItem('lc_user');
    window.location.reload();
  }

  // ── 오답 목록 로드 ─────────────────────────────────────────────
  async function loadNotes() {
    const token = localStorage.getItem('lc_token');

    if (!token) {
      document.getElementById('loginPrompt').style.display = '';
      return;
    }

    document.getElementById('notesSection').style.display = '';

    try {
      const res = await fetch('/api/notes', { headers: { 'Authorization': `Bearer ${token}` } });
      if (!res.ok) throw new Error();
      allNotes = await res.json();
      buildFilterBar();
      renderNotes(allNotes);
    } catch (e) {
      document.getElementById('noteList').innerHTML =
        '<p class="text-sm text-secondary" style="padding:var(--space-8) 0;">오답노트를 불러오는 데 실패했어요.</p>';
    }
  }

  function buildFilterBar() {
    const tags = [...new Set(allNotes.map(n => n.concept_tag).filter(Boolean))];
    const bar = document.getElementById('filterBar');
    bar.innerHTML = `<button class="filter-btn active" onclick="filterByTag(this, '')">전체</button>`;
    tags.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.textContent = tag;
      btn.onclick = function() { filterByTag(this, tag); };
      bar.appendChild(btn);
    });
  }

  function filterByTag(btn, tag) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTag = tag;
    const filtered = tag ? allNotes.filter(n => n.concept_tag === tag) : allNotes;
    renderNotes(filtered);
  }

  function renderNotes(notes) {
    const list = document.getElementById('noteList');
    if (notes.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <div class="empty-state-title">모든 문제를 맞혔어요!</div>
          <p class="text-sm text-secondary" style="margin-top:var(--space-2);">오답 기록이 없습니다. 퀴즈를 풀고 틀린 문제를 확인해보세요.</p>
        </div>
      `;
      return;
    }

    list.innerHTML = notes.map(note => `
      <div class="note-card" id="note-${note.id}">
        <div class="note-meta">
          <span class="badge badge-muted">${typeLabel(note.question_type)}</span>
          ${note.concept_tag ? `<span class="badge badge-primary" style="font-size:var(--text-xs);">${note.concept_tag}</span>` : ''}
          ${note.lecture_date ? `<span class="text-xs text-muted">${note.lecture_date}</span>` : ''}
          <span class="text-xs text-muted" style="margin-left:auto;">${formatDate(note.created_at)}</span>
        </div>
        <div class="note-question">${escHtml(note.question)}</div>
        <div class="note-answers">
          <span class="note-answer-wrong">✗ 내 답: ${escHtml(note.user_answer)}</span>
          <span class="note-answer-correct">✓ 정답: ${escHtml(note.correct_answer)}</span>
        </div>
        ${note.explanation ? `<div class="note-explanation">${escHtml(note.explanation)}</div>` : ''}
        <div class="note-actions">
          <button class="btn btn-secondary btn-sm" onclick="markDone(${note.id})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            복습 완료
          </button>
          <a href="personalized-guide.html${note.concept_tag ? '?query=' + encodeURIComponent(note.concept_tag) : ''}" class="btn btn-primary btn-sm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            이 개념 다시 학습
          </a>
        </div>
      </div>
    `).join('');
  }

  async function markDone(noteId) {
    const token = localStorage.getItem('lc_token');
    if (!token) return;
    try {
      const res = await fetch(`/api/notes/${noteId}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` },
      });
      if (!res.ok) throw new Error();
      allNotes = allNotes.filter(n => n.id !== noteId);
      const card = document.getElementById(`note-${noteId}`);
      if (card) card.remove();
      // 필터 적용 상태에서도 빈 상태 확인
      const filtered = currentTag ? allNotes.filter(n => n.concept_tag === currentTag) : allNotes;
      if (document.querySelectorAll('.note-card').length === 0) renderNotes(filtered);
      buildFilterBar();
    } catch (e) {
      alert('삭제에 실패했어요. 다시 시도해주세요.');
    }
  }

  function typeLabel(type) {
    return { multiple_choice: '객관식', short_answer: '단답형', code_completion: '코드 완성' }[type] || type;
  }

  function formatDate(iso) {
    if (!iso) return '';
    return iso.slice(0, 10);
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  checkAuth();
  loadNotes();
</script>

</body>
</html>
